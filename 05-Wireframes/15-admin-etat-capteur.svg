if" font-weight="400" font-size="10.5" fill="#334155" text-anchor="middle">Journaux techniques</text><rect x="240.0" y="140" width="282.0" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="254.0" y="162" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="start">ÉTAT</text><text x="254.0" y="220" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#334155" text-anchor="start">OK</text><rect x="536.0" y="140" width="282.0" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="550.0" y="162" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="start">DERNIÈRE MESURE</text><text x="550.0" y="220" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#334155" text-anchor="start">15:04 (il y a 3 min)</text><rect x="832.0" y="140" width="282.0" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="846.0" y="162" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="start">BATTERIE</text><text x="846.0" y="220" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#334155" text-anchor="start">87 %</text><rect x="1128.0" y="140" width="282.0" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="1142.0" y="162" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="start">SIGNAL (RSSI)</text><text x="1142.0" y="220" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#334155" text-anchor="start">−97 dBm</text><rect x="240" y="260" width="1170" height="110" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="260" y="290" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="10" fill="#64748B" text-anchor="start">RÉFÉRENCE DU CAPTEUR (DEVEUI)</text><text x="260" y="320" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#334155" text-anchor="start">2CF7F1C04430001A — SenseCAP S2120, toit du bâtiment</text><text x="260" y="350" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="11" fill="#64748B" text-anchor="start">Lecture seule</text><rect x="240" y="390" width="1170" height="220" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><line x1="240" y1="390" x2="1410" y2="610" stroke="#CBD5E1" stroke-width="1"/><line x1="1410" y1="390" x2="240" y2="610" stroke="#CBD5E1" stroke-width="1"/><rect x="718.45" y="489.0" width="213.1" height="22" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="825.0" y="504.0" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="11" fill="#64748B" text-anchor="middle">Batterie et signal sur 30 jours</text><rect x="240" y="630" width="1170" height="90" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="260" y="660" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#334155" text-anchor="start">Règles de l'état (donnée calculée ETAT_CAPTEUR) :</text><text x="260" y="686" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="11.5" fill="#334155" text-anchor="start">Hors ligne si aucune mesure depuis plus de 30 min · sinon Batterie faible si batterie &lt; 20 % · sinon OK.</text><text x="260" y="708" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="11.5" fill="#64748B" text-anchor="start">L'intervalle de mesure et le délai d'absence sont des réglages techniques de l'API (hors base de données).</text></svg>